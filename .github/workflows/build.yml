name: iOS IPA

on:
  push:
    # master is the live branch; other branches build on demand via workflow_dispatch.
    branches: [master]
    # Documentation-only pushes cannot change the IPA, so they must not spend an hour of
    # runner time and publish a duplicate release. Use workflow_dispatch to force a build.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      app_name:
        description: App name shown on iOS
        required: true
        default: Telewhite
      url_scheme:
        description: App-specific URL scheme
        required: true
        default: telewhite

permissions:
  contents: write

# Only one build per branch at a time: a new push cancels queued/running
# builds of the same branch, preventing runner memory exhaustion.
concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Telegram Xcode version
        run: |
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      # Deliberately no "free up disk space" step: this runner reports 94 GB free before the
      # build, so the Bazel cache fits with room to spare. An earlier attempt to delete the
      # unused Xcodes broke the build instead — /Applications/Xcode_26.2.app is a symlink to
      # Xcode_26.2.0.app, so removing the "unused" 26.2.0 destroyed the selected toolchain
      # and every C header (stdlib.h, errno.h) vanished mid-build.

      - name: Create build input
        env:
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          APP_NAME: ${{ inputs.app_name || 'Telewhite' }}
          APP_URL_SCHEME: ${{ inputs.url_scheme || 'telewhite' }}
        run: |
          set -euo pipefail

          mkdir -p build-input

          python3 - <<'PY'
          import json, os

          required = [
              "TG_API_ID",
              "TG_API_HASH",
          ]
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit("Missing GitHub secrets: " + ", ".join(missing))

          config = {
              "bundle_id": "app.teledark",
              "app_name": os.environ["APP_NAME"],
              "api_id": os.environ["TG_API_ID"],
              "api_hash": os.environ["TG_API_HASH"],
              "team_id": "C67CF9S4VU",
              "app_center_id": "0",
              "is_internal_build": "true",
              "is_appstore_build": "false",
              "appstore_id": "0",
              "app_specific_url_scheme": os.environ["APP_URL_SCHEME"],
              "premium_iap_product_id": "",
              "enable_siri": False,
              "enable_icloud": False,
          }

          with open("build-input/fork-configuration.json", "w", encoding="utf-8") as f:
              json.dump(config, f, indent=2)
              f.write("\n")
          PY

      - name: Generate temporary signing profiles
        run: |
          set -euo pipefail

          python3 -u build-system/Make/Make.py \
            generate-verification-profiles \
            --configurationPath=build-input/fork-configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --destination=build-input/generated-profiles

          mkdir -p build-input/generated-codesigning/certs build-input/generated-codesigning/profiles
          cp build-system/fake-codesigning/certs/* build-input/generated-codesigning/certs/
          cp build-input/generated-profiles/*.mobileprovision build-input/generated-codesigning/profiles/

      # Without this the runner recompiles all of Telegram from scratch on every push,
      # which is where ~67 of the ~69 minutes go. Restore is best-effort: a miss just
      # means a cold build, never a failure.
      #
      # The cache lives outside the workspace on purpose — the build step below copies the
      # checkout to /Users/Shared/telegram-ios and wipes that directory first.
      - name: Restore Bazel disk cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-disk-cache
          # versions.json pins Xcode and Bazel; when either moves the old artifacts are
          # unusable, so its hash belongs in the key. run_id keeps the key unique because
          # GitHub caches are immutable once written.
          key: bazel-disk-${{ hashFiles('versions.json') }}-${{ github.run_id }}
          restore-keys: |
            bazel-disk-${{ hashFiles('versions.json') }}-

      - name: Build release IPA
        run: |
          set -euo pipefail

          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/telegram-ios
          sudo cp -R "$GITHUB_WORKSPACE" /Users/Shared/telegram-ios
          sudo chown -R "$USER":staff /Users/Shared/telegram-ios

          cd /Users/Shared/telegram-ios

          BUILD_NUMBER="${GITHUB_RUN_NUMBER}"
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_telegram_ios"

          python3 build-system/Make/ImportCertificates.py --path build-input/generated-codesigning/certs
          # --continueOnError forwards bazel's --keep_going: one run reports every
          # broken target instead of stopping at the first. Harmless on a green tree
          # (the IPA is still produced); drop it if runs get too slow.
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            --cacheDir="$HOME/bazel-disk-cache" \
            build \
            --continueOnError \
            --configurationPath=build-input/fork-configuration.json \
            --codesigningInformationPath=build-input/generated-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER" \
            --sideload \
            --outputBuildArtifactsPath=build/artifacts

          cp build/artifacts/Telegram.ipa build/artifacts/Telewhite-sideload-fake-signed.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Telewhite-sideload-fake-signed-ipa
          path: /Users/Shared/telegram-ios/build/artifacts/Telewhite-sideload-fake-signed.ipa
          if-no-files-found: error

      - name: Generate AltStore source
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          IPA_PATH="build/artifacts/Telewhite-sideload-fake-signed.ipa"

          python3 - "$APP_VERSION" "$IPA_PATH" "$GITHUB_RUN_NUMBER" <<'PY'
          import json, os, sys, datetime

          version, ipa_path, build_number = sys.argv[1], sys.argv[2], sys.argv[3]
          repo = os.environ["GITHUB_REPOSITORY"]
          download_url = f"https://github.com/{repo}/releases/latest/download/Telewhite-sideload-fake-signed.ipa"

          source = {
              "name": "Telewhite",
              "identifier": "app.teledark.source",
              "subtitle": "Telegram fork with Telewhite Mods",
              "website": f"https://github.com/{repo}",
              "apps": [
                  {
                      "name": "Telewhite",
                      "bundleIdentifier": "app.teledark",
                      "developerName": "Telewhite",
                      "subtitle": "Telegram with mods: ghost mode, smart proxy, translator and more",
                      "localizedDescription": "Telegram fork with Telewhite Mods: ghost mode, smart auto-translate, smart proxy, custom app icons and more.",
                      "iconURL": f"https://raw.githubusercontent.com/{repo}/master/Telegram/Telegram-iOS/WhiteFilledIcon.alticon/WhiteFilledIcon%403x.png",
                      "tintColor": "#2AABEE",
                      "versions": [
                          {
                              "version": f"{version}.{build_number}",
                              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
                              "downloadURL": download_url,
                              "size": os.path.getsize(ipa_path),
                              "localizedDescription": f"Build {build_number}. See CHANGELOG.md in the repo for details.",
                              "minOSVersion": "13.0",
                          }
                      ],
                  }
              ],
          }

          with open("build/artifacts/altstore.json", "w", encoding="utf-8") as f:
              json.dump(source, f, indent=2)
              f.write("\n")
          print(json.dumps(source, indent=2))
          PY

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd /Users/Shared/telegram-ios

          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          TAG="v${APP_VERSION}.${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Telewhite $TAG" \
            --notes "Automated build ${GITHUB_RUN_NUMBER} from \`${GITHUB_REF_NAME}\` (${GITHUB_SHA}). Install the IPA with TrollStore, AltStore or SideStore. AltStore source: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/altstore.json" \
            --latest \
            build/artifacts/Telewhite-sideload-fake-signed.ipa \
            build/artifacts/altstore.json

      # Cache housekeeping runs last and cannot fail the job. Anything here is a speed
      # optimisation for the next run, so it must never delay or block a release — and a
      # non-always step failing mid-job would silently skip the publish steps above.
      - name: Trim Bazel disk cache
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail

          echo "Disk after build:"
          df -h /

          # GitHub allows 10 GB of caches per repository and evicts the least recently used
          # ones, so an unbounded Bazel cache would end up pushing out its own entries.
          # Bazel's built-in cache GC only runs while a server idles between builds, which
          # never happens here because the runner is destroyed, so pruning must be explicit.
          python3 - <<'PY'
          import os

          cap = 8 * 1024 ** 3
          root = os.path.expanduser("~/bazel-disk-cache")
          if not os.path.isdir(root):
              # SystemExit with a message would exit 1 and fail the step for no reason.
              print("no cache directory; nothing to trim")
              raise SystemExit(0)

          entries = []
          total = 0
          for dirpath, _, filenames in os.walk(root):
              for name in filenames:
                  path = os.path.join(dirpath, name)
                  try:
                      stat = os.stat(path)
                  except OSError:
                      continue
                  entries.append((stat.st_mtime, stat.st_size, path))
                  total += stat.st_size

          print(f"cache holds {len(entries)} files, {total / 1024 ** 3:.2f} GiB")
          if total <= cap:
              raise SystemExit(0)

          # Oldest first: entries are independent, so dropping one only costs a future miss.
          entries.sort()
          removed = 0
          for _, size, path in entries:
              if total <= cap:
                  break
              try:
                  os.remove(path)
              except OSError:
                  continue
              total -= size
              removed += 1

          print(f"removed {removed} files, now {total / 1024 ** 3:.2f} GiB")
          PY

      - name: Save Bazel disk cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ~/bazel-disk-cache
          key: bazel-disk-${{ hashFiles('versions.json') }}-${{ github.run_id }}
